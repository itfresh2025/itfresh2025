# ============================================================
# Nginx site config — itfresh2025 portfolio
# Replace YOUR_DOMAIN with your actual domain
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Redirect all HTTP → HTTPS (Certbot will fill this in)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/YOUR_DOMAIN;
    index index.html;

    # ── SSL (managed by Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;
    add_header Content-Security-Policy    "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src * data:;" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/font-woff application/font-woff2
        image/svg+xml image/x-icon;

    # ── Caching ──
    location ~* \.(css|js|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA routing ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block hidden files & sensitive paths ──
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* /(\.git|\.env|wp-admin|phpinfo) {
        deny all;
        return 404;
    }

    # ── Rate limiting ──
    limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
    limit_req zone=site burst=60 nodelay;

    # ── Access & error logs ──
    access_log /var/log/nginx/YOUR_DOMAIN.access.log combined buffer=16k;
    error_log  /var/log/nginx/YOUR_DOMAIN.error.log warn;
}
